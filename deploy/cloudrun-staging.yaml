apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: origym-coach-staging
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '2'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: origym-coach:europe-west2:origym-coach-postgres
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      serviceAccountName: origym-coach-staging@origym-coach.iam.gserviceaccount.com
      containers:
        - name: web
          image: europe-west2-docker.pkg.dev/origym-coach/origym-coach/web:cda7740
          ports:
            - containerPort: 8080
          env:
            - name: NGINX_PORT
              value: '8080'
            - name: BACKEND
              value: '127.0.0.1'
            - name: API_PORT
              value: '3000'
            # The API sidecar is a literal IP, so nginx never queries this resolver.
            - name: RESOLVER
              value: '127.0.0.1'
        - name: api
          image: europe-west2-docker.pkg.dev/origym-coach/origym-coach/api:cda7740
          env:
            - name: PORT
              value: '3000'
            - name: DATA_DIR
              value: /tmp/data
            - name: COMPANY_STORE
              value: firestore
            - name: TENANT_STORE
              value: postgres
            # Staging has no branded DNS yet, so only this exact Cloud Run host
            # can resolve to the protected platform tenant.
            - name: TENANT_FALLBACK_HOST
              value: origym-coach-staging-941132449542.europe-west2.run.app
            - name: TENANT_FALLBACK_SLUG
              value: origym
            - name: CLOUD_SQL_CONNECTION_NAME
              value: origym-coach:europe-west2:origym-coach-postgres
            - name: DATABASE_NAME
              value: origym_coach
            - name: DATABASE_USER
              value: origym_coach_app
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: origym-coach-db-password
                  key: latest
            - name: GOOGLE_CLOUD_PROJECT
              value: origym-coach
            - name: COACH_BASE_DOMAIN
              value: coach.origym.co.uk
            - name: RP_ID
              value: origym-coach-staging-941132449542.europe-west2.run.app
            - name: ORIGIN
              value: https://origym-coach-staging-941132449542.europe-west2.run.app
            - name: RP_NAME
              value: OriGym Coach Staging
            - name: INVITE_ONLY
              value: 'true'
            - name: ALLOW_GUEST
              value: 'false'
